[metadata]
name = nanoribbons
version = 2.2.0
description = Tools for graphene nanoribbons, developed at the nanotech@surfaces laboratory, Empa
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/nanotech-empa/aiidalab-empa-nanoribbons
author = nanotech@surfaces laboratory, Empa
license = MIT
license_files = LICENSE.txt
classifiers =
    Development Status :: 5 - Production/Stable
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
project_urls =
    Logo = https://raw.githubusercontent.com/nanotech-empa/aiidalab-empa-nanoribbons/main/miscellaneous/logos/empa.png
    Documentation = https://github.com/nanotech-empa/aiidalab-empa-nanoribbons/#readme
    Bug Tracker = https://github.com/nanotech-empa/aiidalab-empa-nanoribbons/issues

[options]
packages = find:
install_requires =
    aiida-core>=2.9.4,<3
    aiida-cp2k>=2.2.1,<3
    aiida-nanotech-empa@git+https://github.com/nanotech-empa/aiida-nanotech-empa.git@d62cf00a48a5375a1e77b436ef3a282959c88696
    aiida-pseudo~=1.11
    aiida-quantumespresso>=5,<6
    aiidalab>=26.9.0
    aiidalab-widgets-base[smiles]==3.0.1
    aiidalab-widgets-empa@git+https://github.com/nanotech-empa/aiidalab-widgets-empa.git@3473d7f3ac6cac57d1343d44f6177c56aea2436a
    ase>=3.24
    bqplot
    cp2k-input-tools>=0.9.3
python_requires = >=3.12

[options.extras_require]
dev =
    bumpver==2023.1124
    pre-commit==3.3.2

[aiidalab]
title = Empa nanotech@surfaces Laboratory - Graphene nanoribbons

[flake8]
ignore =
    E501
    W503
    E203

[bumpver]
current_version = "v2.2.0"
version_pattern = "vMAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "Bump version: {old_version} → {new_version}"
commit = True
tag = True
push = True

[bumpver:file_patterns]
setup.cfg =
    current_version = "{version}"
    version = {pep440_version}
