[metadata]
name = nanoribbons
version = 2.2.0
description = Tools for graphene nanoribbons, developed at the nanotech@surfaces laboratory, Empa
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/nanotech-empa/aiidalab-empa-nanoribbons
author = nanotech@surfaces laboratory, Empa
license = MIT
license_files = LICENSE.txt
classifiers =
    Development Status :: 5 - Production/Stable
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
project_urls =
    Logo = https://raw.githubusercontent.com/nanotech-empa/aiidalab-empa-nanoribbons/main/miscellaneous/logos/empa.png
    Documentation = https://github.com/nanotech-empa/aiidalab-empa-nanoribbons/#readme
    Bug Tracker = https://github.com/nanotech-empa/aiidalab-empa-nanoribbons/issues

[options]
packages = find:
install_requires =
    aiida-core>=2.8,<3
    aiida-cp2k>=2.2.1,<3
    aiida-nanotech-empa@git+https://github.com/nanotech-empa/aiida-nanotech-empa.git@560ce8a42564707dc54c8ec572e69ad4b88b3c2f
    aiida-pseudo~=1.11
    aiida-quantumespresso>=5,<6
    aiidalab>=26.9.0
    aiidalab-widgets-base[smiles]@git+https://github.com/cpignedoli/aiidalab-widgets-base.git@f2773b82017d503c40751f9c082f941eef83ee33
    aiidalab-widgets-empa@git+https://github.com/nanotech-empa/aiidalab-widgets-empa.git@8a85258bbb449ff99c1d0ee302fd4b6ae887c254
    ase>=3.24
    bqplot
    cp2k-input-tools>=0.9.3
python_requires = >=3.12

[options.extras_require]
dev =
    bumpver==2023.1124
    pre-commit==3.3.2

[aiidalab]
title = Empa nanotech@surfaces Laboratory - Graphene nanoribbons

[flake8]
ignore =
    E501
    W503
    E203

[bumpver]
current_version = "v2.2.0"
version_pattern = "vMAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "Bump version: {old_version} → {new_version}"
commit = True
tag = True
push = True

[bumpver:file_patterns]
setup.cfg =
    current_version = "{version}"
    version = {pep440_version}
