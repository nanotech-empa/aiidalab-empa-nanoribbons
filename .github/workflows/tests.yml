---
name: Tests
on:
    pull_request:
    push:
        branches:
            - main
            - aiida-core-2.8
            - feature/bands-pdos-igor-export
            - feature/openbis-structure-importer
        tags:
            - v*
jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Install app and test dependencies
              run: python -m pip install . pytest
            - name: Check dependency consistency
              run: python -m pip check
            - name: Test viewers and notebook contracts
              if: hashFiles('tests/test_*.py') != ''
              env:
                  MPLBACKEND: Agg
                  AIIDA_PATH: ${{ runner.temp }}/nanoribbons-aiida-tests
              run: python -m pytest -q tests
