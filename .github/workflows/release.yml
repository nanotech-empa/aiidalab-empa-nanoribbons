---
name: Release
on:
    push:
        tags:
            - v*
jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - uses: softprops/action-gh-release@v0.1.14
              name: Create release.
              with:
                  generate_release_notes: true
                  prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
